<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyntaxWear - Tênis e Sneakers Online</title>
  <link rel="stylesheet" href="./css/reset.css">
  <Link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components/header.css">
  <link rel="stylesheet" href="./css/components/panel.css">
  <link rel="stylesheet" href="./css/components/hero.css">
  <link rel="stylesheet" href="./css/components/product-grid.css">
  <link rel="stylesheet" href="./css/components/product-card.css">
  <link rel="stylesheet" href="./css/components/footer.css">
  <link rel="stylesheet" href="./css/components/newsletter.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">
      <a href="/" title="SyntaxWear - Tênis e Sneakers Online"> 
        <img src="./images/logos/Logo.svg" alt="SyntaxWear - Tênis e Sneakers Online">
      </a>
    </h1>

    <nav class="nav-center" aria-label="Categorias principais">
      <ul>
        <li><a href="#">Masculino</a></li>
        <li><a href="#">Feminino</a></li>
        <li><a href="#">Outlet</a></li>
      </ul> 
 <!-- Links de navegação -->
    </nav>
    
    <nav class="nav-right" aria-label="Links secundários">
      <ul>
        <li><a href="#">Nossas lojas</a></li>
        <li><a href="#">Sobre</a></li>
        <li>
           <a href="#" class="icon-link" aria-label="Minha conta">
             <img src="./images/icons/user.svg" alt="Minha conta" class="icon icon-user">
           </a>
        </li>
        <li>
           <a href="#" class="icon-link" aria-label="Ajuda">
             <img src="./images/icons/help.svg" alt="Ajuda" class="icon icon-help">
           </a>
        </li>
        <li>
           <a href="#" class="icon-link" aria-label="Carrinho">
             <img src="./images/icons/bag.svg" alt="Carrinho" class="icon icon-cart">
           </a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="Destaque">
      <!-- Seção hero (macro) -->
       <h1>Título do site de e-commerce de tênis </h1>
    </section>

    <section class="categories" aria-label="Categorias de tênis">
      <!-- Seção de categoria de tênis (macro) -->
    </section>

    <section class="product-grid" aria-label="Produtos em destaque">
      <!-- Grid com produtos com destaque (macro) -->
    </section>
  </main>

  <footer>
    <div class="container footer-inner">
      <!-- Contatos e links (macro) -->
    </div>
  </footer>
</body>
</html>
